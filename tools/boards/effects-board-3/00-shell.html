<title>Wikster Effects Board III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* ---- the board (one theme on purpose: these cards are built for the app's night sky) ---- */
:root {
  --ground: #080b1a; --ground-2: #05070f; --panel: #10142a; --panel-2: #161b36;
  --ink: #eaeefb; --ink-dim: #93a0c4; --ink-faint: #5d6a8c; --keyline: rgba(255,255,255,.11);
  --surface-solid: #10142a; --line: rgba(255,255,255,.11); --positive: #6ee7b7; --warning: #fcd34d;
  --radius-pill: 999px; --border: 1px; --border-style: solid;
  --surface-shadow: 0 18px 40px -24px rgba(0,0,0,.9);
  --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Archivo', 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ease: cubic-bezier(.22,1,.36,1);
  --card-w: 258px; --card-radius: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(180deg, var(--ground), #0a0e20 55%, var(--ground-2)) fixed; color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.glow { position: fixed; z-index: 0; width: 60vmax; height: 60vmax; border-radius: 50%; pointer-events: none; filter: blur(40px); opacity: .5; }
.glow.one { left: -20vmax; top: -10vmax; background: radial-gradient(circle, rgba(34,211,238,.18), transparent 60%); animation: drift-a 26s ease-in-out infinite alternate; }
.glow.two { right: -25vmax; bottom: -20vmax; background: radial-gradient(circle, rgba(192,132,252,.16), transparent 60%); animation: drift-b 31s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(12vmax, 10vmax); } }
@keyframes drift-b { to { transform: translate(-14vmax, -8vmax); } }
header, main, footer { position: relative; z-index: 1; }
header { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 13px 22px; background: color-mix(in srgb, var(--ground) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--keyline); }
header h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
header h1 small { display: block; margin-top: 3px; font-family: var(--mono); font-weight: 400; font-size: 11.5px; color: var(--ink-dim); letter-spacing: 0; max-width: 60ch; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.controls input { accent-color: #22d3ee; }
button { font: 600 12px/1 var(--mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--keyline); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
button:hover { background: #1f2649; }
button:focus-visible, .card:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 22px 0; max-width: 1500px; margin: 0 auto; }
.jump a { font: 600 11px/1 var(--mono); text-decoration: none; color: var(--ink-dim); border: 1px solid var(--keyline); border-radius: 999px; padding: 7px 11px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
.jump a:hover { color: var(--ink); border-color: var(--tier, #22d3ee); }
main { max-width: 1500px; margin: 0 auto; padding: 20px 22px 70px; display: flex; flex-direction: column; gap: 48px; }
.tier { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 96px; }
.tier-head { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: start; }
.swatch { width: 14px; height: 14px; margin-top: 6px; border-radius: 4px; background: var(--tier); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 0 18px color-mix(in srgb, var(--tier) 60%, transparent); }
.tier-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.015em; text-wrap: balance; }
.tier-head h2 span { color: var(--tier); }
.tier-head h2 em { font-style: normal; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-left: 10px; }
.tier-head p { grid-column: 2; margin: 0; max-width: 74ch; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--ink-dim); }
.row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 1240px) { .row { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } :root { --card-w: min(74vw, 264px); } }
.pick { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 11px 14px; border-radius: 20px; background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--keyline); transition: border-color .2s, box-shadow .2s; }
.pick.is-chosen { border-color: var(--tier); box-shadow: 0 0 0 1px var(--tier), 0 0 34px -12px var(--tier); }
.pick figcaption { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.pick b { font-size: 13.5px; font-weight: 800; }
.pick b i { font-style: normal; font-family: var(--mono); font-weight: 600; color: var(--tier); margin-right: 7px; }
.pick p { margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--ink-dim); min-height: 4.5em; }
.choose { align-self: center; }
.is-chosen .choose { background: var(--tier); color: #06070f; border-color: var(--tier); }
footer { position: sticky; bottom: 0; z-index: 6; max-width: 1500px; margin: 0 auto; padding: 0 22px 16px; }
.picks { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border-radius: 16px; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--keyline); }
.picks h3 { margin: 0; font-size: 14px; }
#picks-text { flex: 1 1 320px; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--ink-dim); word-break: break-word; }
#picks-text b { color: var(--ink); font-weight: 600; }
.paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

/* ---- the card, mirrored from src/styles/cards.css ---- */
.card { position: relative; width: var(--card-w); aspect-ratio: 5 / 7; isolation: isolate; perspective: 1000px; container-type: inline-size; --tx: 0; --ty: 0; --lx: 0; --ly: 0; color: var(--ink); font-family: var(--font); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.card:active { cursor: grabbing; }
.card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(calc(var(--ty) * -10deg)) rotateY(calc(var(--tx) * 12deg)); }
.card-face { position: absolute; inset: 0; border-radius: var(--card-radius); overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: var(--border) var(--border-style) var(--line); box-shadow: var(--surface-shadow); }
.card-front { isolation: isolate; display: flex; flex-direction: column;
  background: linear-gradient(180deg, color-mix(in srgb, var(--rarity, #6b7280) 30%, var(--surface-solid)), color-mix(in srgb, var(--rarity, #6b7280) 12%, var(--surface-solid)) 42%, color-mix(in srgb, var(--rarity, #6b7280) 22%, var(--surface-solid)));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rarity, #6b7280) 60%, transparent); }
.card-art { position: relative; flex: none; height: 46%; margin: 3.2% 3.2% 0; border-radius: calc(var(--card-radius) * 0.5); overflow: hidden; background: color-mix(in srgb, var(--ink) 8%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--rarity, var(--line)) 60%, transparent), 0 3cqw 6cqw -3cqw rgba(0,0,0,.8); }
.card-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.16), transparent 24% 70%, rgba(0,0,0,.3)); }
.fav-button { position: absolute; top: 8px; right: 8px; z-index: 3; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; color: rgba(255,255,255,.7); background: rgba(0,0,0,.42); backdrop-filter: blur(4px); }
.fav-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.card-body { position: relative; z-index: 2; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1.2cqw; padding: 3.4cqw 4.9cqw 0; }
.card-title { margin: 0; flex: none; font-size: 6cqw; font-weight: 800; line-height: 1.18; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc { margin: 0; flex: none; font-size: 3.9cqw; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--rarity, var(--ink-dim)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-extract { margin: 1cqw 0 0; flex: 0 1 auto; min-height: 0; font-size: 4.2cqw; line-height: 1.45; color: var(--ink-dim); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; mask-image: linear-gradient(180deg, #000 74%, transparent); -webkit-mask-image: linear-gradient(180deg, #000 74%, transparent); }
.card-stats { position: relative; z-index: 2; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2.8cqw 4.9cqw 2cqw; }
.card-price { font-size: 6cqw; font-weight: 800; color: var(--positive); display: inline-flex; align-items: baseline; gap: 2px; }
.card-price .buck { height: .8em; width: auto; }
.card-views { font-size: 4cqw; font-weight: 700; color: var(--ink-faint); }
.card-footer { position: relative; z-index: 2; padding: 0 4.9cqw 4cqw; }
.rarity-badge { display: inline-flex; padding: 1.5cqw 4.2cqw; border-radius: var(--radius-pill); border: 1px solid var(--rarity, var(--line)); background: color-mix(in srgb, var(--rarity, var(--line)) 14%, transparent); color: var(--rarity, var(--ink)); font-size: 3.8cqw; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.fx-ring { position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: var(--card-radius); padding: 2.5px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); overflow: hidden; }
.fx-ring::before { content: ''; position: absolute; inset: -60%; }
.fx-art { position: absolute; inset: 3.2% 3.2% 50.4%; z-index: 1; border-radius: calc(var(--card-radius) * 0.5); overflow: hidden; pointer-events: none; }
.fx-p, .fx-code { position: absolute; inset: 0; pointer-events: none; }
.fx-p i { position: absolute; display: block; border-radius: 50%; }
[data-rarity=common] { --rarity: #9aa5b1; } [data-rarity=uncommon] { --rarity: #4ade80; } [data-rarity=rare] { --rarity: #3b82f6; } [data-rarity=epic] { --rarity: #c084fc; }
[data-rarity=legendary] { --rarity: #fbbf24; } [data-rarity=mythic] { --rarity: #e02134; } [data-rarity=exotic] { --rarity: #22d3ee; } [data-rarity=prismatic] { --rarity: #f472b6; }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes turn-a { to { --a: 360deg; } }
@keyframes hue { to { filter: hue-rotate(1turn); } }
@keyframes pearl { to { background-position: 250% 0; } }
@keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: .95 } }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0 } 10% { opacity: 1 } 100% { transform: translateY(-150cqw) translateX(var(--sx, 0)) scale(1); opacity: 0 } }
@keyframes sweepx { from { transform: translateX(-45%) } to { transform: translateX(45%) } }
@keyframes scrolly { to { transform: translateY(-50%) } }
